name: Linux AppImage release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: volyx-lens-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-appimage:
    name: Build ${{ matrix.arch }} AppImage
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    environment: linux-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run check:syntax
      - run: npm run security:secrets
      - run: npm audit --audit-level=low
      - name: Build AppImage
        run: |
          npm pkg set "build.publish[0].channel=latest-${{ matrix.arch }}"
          npm pkg set "build.extraMetadata.volyxReleaseBuild=true" --json
          npx electron-builder --linux AppImage --${{ matrix.arch }} --publish never
      - name: Smoke launch packaged application
        run: |
          APPIMAGE_PATH="$(find dist -maxdepth 1 -type f -name "*.AppImage" -print -quit)"
          test -n "$APPIMAGE_PATH"
          echo "Smoke launching: $(basename "$APPIMAGE_PATH")"
          chmod +x "$APPIMAGE_PATH"
          "$APPIMAGE_PATH" --appimage-extract-and-run --no-sandbox --smoke-test 2>&1 || true
      - name: Generate checksum and SBOM
        run: |
          ARCH="${{ matrix.arch }}"
          echo "dist contents:"
          ls -la dist
          APPIMAGE_PATH="$(find dist -maxdepth 1 -type f -name "*.AppImage" -print -quit)"
          test -n "$APPIMAGE_PATH"
          APPIMAGE_NAME="$(basename "$APPIMAGE_PATH")"
          # electron-builder uses x86_64 as the artifact token on Linux x64
          # builds (for example volyx-lens-0.5.1-linux-x86_64.AppImage).
          FILE_ARCH="$(printf '%s' "$APPIMAGE_NAME" | sed -n 's/.*-linux-\([a-z0-9_]*\)\.AppImage$/\1/p')"
          echo "Using AppImage: $APPIMAGE_NAME (file arch token: ${FILE_ARCH:-unknown})"
          # electron-builder names the update metadata file per channel/arch;
          # discover whichever one references this archive instead of assuming
          # a single naming scheme.
          META=""
          for candidate in "latest-${ARCH}-linux-${FILE_ARCH}.yml" "latest-${ARCH}-linux.yml" "latest-linux-${FILE_ARCH}.yml" "latest-linux.yml" "latest-${ARCH}.yml" "latest.yml"; do
            if [ -f "dist/$candidate" ]; then META="dist/$candidate"; echo "Using update metadata: $candidate"; break; fi
          done
          test -n "$META"
          # electron-updater always requests latest-<arch>-linux.yml for Linux;
          # canonicalize whatever electron-builder actually wrote (arm64 can
          # arrive as latest-arm64-linux-arm64.yml).
          EXPECTED_META="latest-${ARCH}-linux.yml"
          if [ "$(basename "$META")" != "$EXPECTED_META" ]; then
            mv "$META" "dist/$EXPECTED_META"
            echo "Canonicalized update metadata to: $EXPECTED_META"
            META="dist/$EXPECTED_META"
          fi
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/validate-update-metadata.js "$META" "$APPIMAGE_PATH" "$VERSION" "$ARCH" "linux" \
            || { echo "Metadata validation failed; dist contents:"; ls -la dist; exit 1; }
          # shasum (Perl) is not installed on all runners; hash with node.
          APPIMAGE_NAME="$APPIMAGE_NAME" node -e "const fs=require('fs'),c=require('crypto');const n=process.env.APPIMAGE_NAME;const p='dist/'+n;fs.writeFileSync(p+'.sha256',c.createHash('sha256').update(fs.readFileSync(p)).digest('hex')+'  '+n+'\n');"
          npm sbom --sbom-format cyclonedx > "dist/volyx-lens-linux-${{ matrix.arch }}.cdx.json"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*.AppImage
      - name: Attest signed archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*.AppImage
          sbom-path: dist/volyx-lens-linux-${{ matrix.arch }}.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: volyx-lens-linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/latest*.yml
            dist/volyx-lens-linux-${{ matrix.arch }}.cdx.json
          if-no-files-found: error

  publish-release:
    needs: build-appimage
    runs-on: ubuntu-latest
    environment: linux-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: volyx-lens-linux-*
          path: dist
          merge-multiple: true
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Volyx Lens $TAG" --generate-notes; then
            echo "Release created by this workflow."
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; uploading assets."
          else
            echo "Failed to create or locate release $TAG." >&2
            exit 1
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber