name: Linux AppImage release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: volyx-lens-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-appimage:
    name: Build ${{ matrix.arch }} AppImage
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    environment: linux-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run check:syntax
      - run: npm run security:secrets
      - run: npm audit --audit-level=low
      - name: Build AppImage
        run: |
          npm pkg set "build.publish[0].channel=latest"
          npm pkg set "build.extraMetadata.volyxReleaseBuild=true" --json
          npx electron-builder --linux AppImage --${{ matrix.arch }} --publish never
      - name: Smoke launch packaged application
        run: |
          APPIMAGE_PATH="$(find dist -maxdepth 1 -type f -name "*.AppImage" -print -quit)"
          test -n "$APPIMAGE_PATH"
          chmod +x "$APPIMAGE_PATH"
          "$APPIMAGE_PATH" --appimage-extract-and-run --no-sandbox --smoke-test 2>&1 || true
      - name: Generate checksum and SBOM
        run: |
          APPIMAGE_PATH="$(find dist -maxdepth 1 -type f -name "*.AppImage" -print -quit)"
          APPIMAGE_NAME="$(basename "$APPIMAGE_PATH")"
          test -f "dist/latest-linux.yml"
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/validate-update-metadata.js "dist/latest-linux.yml" "$APPIMAGE_PATH" "$VERSION" "${{ matrix.arch }}" "linux"
          (cd dist && shasum -a 256 "$APPIMAGE_NAME" > "$APPIMAGE_NAME.sha256")
          npm sbom --sbom-format cyclonedx > "dist/volyx-lens-linux-${{ matrix.arch }}.cdx.json"
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.AppImage
      - name: Attest signed archive SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/*.AppImage
          sbom-path: dist/volyx-lens-linux-${{ matrix.arch }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: volyx-lens-linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/latest-linux.yml
            dist/volyx-lens-linux-${{ matrix.arch }}.cdx.json
          if-no-files-found: error

  publish-release:
    needs: build-appimage
    runs-on: ubuntu-latest
    environment: linux-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: volyx-lens-linux-*
          path: dist
          merge-multiple: true
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Volyx Lens $GITHUB_REF_NAME" \
              --generate-notes
          fi