name: Signed Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: volyx-lens-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign:
    name: Build ${{ matrix.arch }} NSIS installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
    runs-on: windows-latest
    timeout-minutes: 40
    environment: windows-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$env:GITHUB_SHA" "origin/main"
        shell: pwsh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
        shell: bash
      - run: npm ci
      - run: npm test
      - run: npm run check:syntax
      - run: npm run security:secrets
      - run: npm audit --audit-level=low
      - name: Pin the update publisher to the signing certificate
        shell: pwsh
        env:
          CSC_LINK_VALUE: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          # electron-updater on Windows only verifies an update's signer when
          # publisherName is set, so it is taken from the certificate that signs this
          # build rather than typed by hand (VR-25).
          #
          # A secret cannot be read from an `if:` expression, so the guard lives here.
          if (-not $env:CSC_LINK_VALUE) {
            Write-Host 'No signing certificate configured; the publisher name stays unset.'
            exit 0
          }
          $source = $env:CSC_LINK_VALUE
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          if ($source -match '^https?://') {
            Invoke-WebRequest -Uri $source -OutFile $pfx
          } else {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($source))
          }
          # A release PFX is normally password protected. Without the password
          # Get-PfxCertificate would prompt, which ends the non-interactive job.
          $password = $env:CSC_KEY_PASSWORD_VALUE
          if ($password) {
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = Get-PfxCertificate -FilePath $pfx -Password $secure -NoPromptForPassword
          } else {
            $cert = Get-PfxCertificate -FilePath $pfx -NoPromptForPassword
          }
          if (-not $cert) { throw 'The signing secret did not contain a certificate' }
          Write-Host "Signing as $($cert.Subject)"
          npm pkg set "build.win.publisherName=$($cert.Subject)"
          Remove-Item $pfx -Force

      - name: Build NSIS installer
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_LINK_VALUE: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          npm pkg set "build.publish[0].channel=latest"
          # Only a signed installer may advertise itself as self-updating. Without a
          # signer there is nothing for electron-updater to verify, and the README
          # promises update metadata is consumed only by signed release builds (VR-25).
          if [ -n "$CSC_LINK_VALUE" ]; then
            npm pkg set "build.extraMetadata.volyxReleaseBuild=true" --json
          else
            echo "No signing certificate configured: this installer cannot self-update."
          fi
          npx electron-builder --win nsis --x64 --publish never
          if [ -z "$CSC_LINK_VALUE" ]; then
            # Mirror build-windows-unsigned.yml: an unsigned release publishes no
            # update metadata, so no installed client can be moved onto it
            # automatically through TLS plus a checksum alone.
            rm -f dist/latest.yml dist/*.blockmap
            test ! -f dist/latest.yml
          fi
      - name: Verify the installer signature
        shell: pwsh
        env:
          CSC_LINK_VALUE: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No installer to verify" }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          Write-Host "Signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          if ($env:CSC_LINK_VALUE) {
            # Updates are only trusted through TLS and the checksum in latest.yml when
            # the installer is unsigned, so a configured certificate has to produce a
            # valid signature or this release does not ship (VR-25).
            if ($signature.Status -ne 'Valid') {
              throw "Installer signature is $($signature.Status); a signing certificate is configured, so this build must be signed"
            }
            # electron-updater compares the update's signer to this value, so record
            # the subject of the certificate that actually signed the build.
            $subject = $signature.SignerCertificate.Subject
            "WINDOWS_PUBLISHER_NAME=$subject" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Warning "No signing certificate configured: the installer ships unsigned with no latest.yml, so it has no auto-update channel at all."
          }

      - name: Smoke launch packaged application
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No NSIS installer produced" }
          Write-Host "Built: $($exe.Name)"
      - name: Generate checksum and SBOM
        shell: bash
        env:
          CSC_LINK_VALUE: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          NSIS_PATH="$(find dist -maxdepth 1 -type f -name "*.exe" -print -quit)"
          NSIS_NAME="$(basename "$NSIS_PATH")"
          # Signed builds publish updater metadata and it must describe this
          # installer; unsigned builds must publish none at all.
          if [ -f "dist/latest.yml" ]; then
            VERSION="$(node -p "require('./package.json').version")"
            node scripts/validate-update-metadata.js "dist/latest.yml" "$NSIS_PATH" "$VERSION" "x64" "win32"
          else
            test -z "$CSC_LINK_VALUE"
            echo "Unsigned build: no latest.yml published, auto-update intentionally unavailable."
          fi
          # shasum (Perl) is not installed on Windows runners; hash with node.
          NSIS_NAME="$NSIS_NAME" node -e "const fs=require('fs'),c=require('crypto');const n=process.env.NSIS_NAME;const p='dist/'+n;fs.writeFileSync(p+'.sha256',c.createHash('sha256').update(fs.readFileSync(p)).digest('hex')+'  '+n+'\n');"
          # Assert the whole published set, not just one file: a signed build
          # must carry latest.yml and an unsigned build must not, exactly one
          # installer ships with its checksum, and a re-run that left a second
          # version behind fails here instead of clobbering the release.
          if [ -n "$CSC_LINK_VALUE" ]; then
            node scripts/verify-release-assets.js --platform win32 --dir dist --signed --arch x64
          else
            node scripts/verify-release-assets.js --platform win32 --dir dist --arch x64
          fi
          npm sbom --sbom-format cyclonedx > "dist/volyx-lens-windows.cdx.json"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*.exe
      - name: Attest signed archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*.exe
          sbom-path: dist/volyx-lens-windows.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: volyx-lens-windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.exe.sha256
            dist/latest.yml
            dist/volyx-lens-windows.cdx.json
          if-no-files-found: error

  publish-release:
    needs: build-sign
    runs-on: ubuntu-latest
    environment: windows-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: volyx-lens-windows-*
          path: dist
          merge-multiple: true
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Volyx Lens $TAG" --generate-notes; then
            echo "Release created by this workflow."
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; uploading assets."
          else
            echo "Failed to create or locate release $TAG." >&2
            exit 1
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber