name: Signed macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: volyx-lens-macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-notarize:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    environment: macos-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run check:syntax
      - run: npm run security:secrets
      - run: npm audit --audit-level=low
      - name: Prepare optional App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi
      - name: Build, sign, and notarize
        run: |
          node scripts/check-macos-release.js --require-credentials
          npm pkg set "build.publish[0].channel=latest-${{ matrix.arch }}"
          npm pkg set "build.extraMetadata.volyxReleaseBuild=true" --json
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - run: npm run verify:vision-ocr-package
      - name: Verify signature, notarization, and architecture
        run: |
          ZIP_PATH="$(find dist -maxdepth 1 -type f -name "*-${{ matrix.arch }}.zip" -print -quit)"
          DMG_PATH="$(find dist -maxdepth 1 -type f -name "*-${{ matrix.arch }}.dmg" -print -quit)"
          test -n "$ZIP_PATH"
          test -n "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          VERIFY_DIR="$(mktemp -d)"
          MOUNT_DIR="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet || true
            rm -rf "$VERIFY_DIR" "$MOUNT_DIR"
          }
          trap cleanup EXIT
          validate_app() {
            local app_path="$1"
            test -d "$app_path"
            python3 - "$app_path/Contents/MacOS/Volyx Lens" <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.argv[1], '--smoke-test'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=15)
          print(result.stdout)
          if result.returncode != 0 or 'VOLYX_LENS_RENDERER_READY' not in result.stdout:
              raise SystemExit('Signed application did not report renderer readiness.')
          PY
            test "$(defaults read "$app_path/Contents/Info" CFBundleIdentifier)" = "ai.volyx.lens"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q "Authority=Developer ID Application"
            xcrun stapler validate "$app_path"
            spctl --assess --verbose --type exec "$app_path"
            file "$app_path/Contents/MacOS/Volyx Lens" | grep -q "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          }
          ditto -x -k "$ZIP_PATH" "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR" -type d -name 'Volyx Lens.app' -print -quit)"
          test -n "$APP_PATH"
          validate_app "$APP_PATH"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_DIR" "$DMG_PATH"
          DMG_APP_PATH="$MOUNT_DIR/Volyx Lens.app"
          validate_app "$DMG_APP_PATH"
      - name: Generate checksum and SBOM
        run: |
          ZIP_PATH="$(find dist -maxdepth 1 -type f -name "*-${{ matrix.arch }}.zip" -print -quit)"
          DMG_PATH="$(find dist -maxdepth 1 -type f -name "*-${{ matrix.arch }}.dmg" -print -quit)"
          ZIP_NAME="$(basename "$ZIP_PATH")"
          DMG_NAME="$(basename "$DMG_PATH")"
          APP_ASAR="$(find dist -path '*/Volyx Lens.app/Contents/Resources/app.asar' -print -quit)"
          test -n "$APP_ASAR"
          node -e "const asar=require('@electron/asar'); const pkg=JSON.parse(asar.extractFile(process.argv[1], 'package.json')); if (pkg.volyxReleaseBuild !== true) throw new Error('Missing official release-build marker');" "$APP_ASAR"
          METADATA_PATH="dist/latest-${{ matrix.arch }}-mac.yml"
          test -f "$METADATA_PATH"
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/validate-update-metadata.js "$METADATA_PATH" "$ZIP_PATH" "$VERSION" "${{ matrix.arch }}"
          (cd dist && shasum -a 256 "$ZIP_NAME" > "$ZIP_NAME.sha256")
          (cd dist && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
          npm sbom --sbom-format cyclonedx > "dist/volyx-lens-${{ matrix.arch }}.cdx.json"
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*-${{ matrix.arch }}.zip
            dist/*-${{ matrix.arch }}.dmg
      - name: Attest signed archive SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/*-${{ matrix.arch }}.zip
          sbom-path: dist/volyx-lens-${{ matrix.arch }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: volyx-lens-macos-${{ matrix.arch }}
          path: |
            dist/*-${{ matrix.arch }}.zip
            dist/*-${{ matrix.arch }}.zip.sha256
            dist/*-${{ matrix.arch }}.dmg
            dist/*-${{ matrix.arch }}.dmg.sha256
            dist/latest-${{ matrix.arch }}-mac.yml
            dist/volyx-lens-${{ matrix.arch }}.cdx.json
          if-no-files-found: error

  publish-release:
    needs: build-sign-notarize
    runs-on: ubuntu-latest
    environment: macos-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: volyx-lens-macos-*
          path: dist
          merge-multiple: true
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Volyx Lens $TAG" --generate-notes; then
            echo "Release created by this workflow."
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; uploading assets."
          else
            echo "Failed to create or locate release $TAG." >&2
            exit 1
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
