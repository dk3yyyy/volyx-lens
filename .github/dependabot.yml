version: 2
# Grouped updates keep the PR noise down while still surfacing security fixes.
# The overrides in package.json pin a few transitive packages by hand; without
# this file they are the only supply-chain defence between releases.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # Majors land as PRs nobody asked for and are not safe to take
      # mechanically: Electron moves Node and Chromium, the provider SDKs move
      # their wire shapes, and the build tooling moves its config. Security
      # advisories still come through as alerts. Bump a major by hand when there
      # is a reason to.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # The workflows pin full SHAs on purpose; a major action bump changes its
      # inputs and needs a read of the changelog, not a green CI.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
